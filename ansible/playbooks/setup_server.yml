---
- name: Configure CloudPilot server
  hosts: cloudpilot
  become: true
  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - python3
          - ufw
        state: present
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
